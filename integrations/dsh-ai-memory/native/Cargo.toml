[package]
name = "ai-memory-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "napi-rs Node addon over the ai-memory Rust crate"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ai-memory = { path = "../../.." }
napi = { version = "2.16", default-features = false, features = ["napi8"] }
napi-derive = "2.16"
serde_json = "1"
# Transitive pins for rustc 1.83 (crate rust-version is 1.74).
unicode-segmentation = "=1.12.0"

[build-dependencies]
# 2.4+ needs rustc 1.88; crate MSRV is 1.74 / CI-like 1.83.
napi-build = "=2.1.3"
