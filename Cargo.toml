[workspace]
members = [".", "integrations/dsh-ai-memory/native"]
default-members = ["."]
resolver = "2"

[package]
name = "ai-memory"
# npm/dsh bundle at repo root is package.json name "dsh-ai-memory" — different on purpose.
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Personal AI memory semantic layer (Rust + SQLite): working / episodic / profile with hybrid recall"
repository = "https://github.com/zzjzzb/ai-memory"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ai", "memory", "sqlite", "rag", "recall"]
categories = ["database"]

[[bin]]
name = "ai-memory"
path = "src/bin/ai-memory.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = { version = "=0.1.6", optional = true }

[dev-dependencies]
# Not part of `cargo test`. Pin transitive crates that otherwise resolve to
# rustc 1.90+ / edition 2024 on a 1.83 toolchain.
criterion = { version = "=0.4.0", default-features = false }
textwrap = { version = "=0.16.1", default-features = false }
smawk = "=0.3.2"

[features]
default = []
# Optional sqlite-vec VectorIndex (compiles the C extension). Default recall
# still uses in-crate BruteForceCosine unless you inject SqliteVecIndex.
sqlite-vec = ["dep:sqlite-vec"]

[[bench]]
name = "memory_hot_path"
harness = false
