[package]
name = "ai-memory"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Personal AI memory semantic layer (Rust + SQLite): working / episodic / profile with hybrid recall"
repository = "https://github.com/zzjzzb/ai-memory"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ai", "memory", "sqlite", "rag", "recall"]
categories = ["database"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
